<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dicompare has moved</title>
<link rel="canonical" href="https://webapps.neurodesk.org/dicompare/">
<meta http-equiv="refresh" content="0; url=https://webapps.neurodesk.org/dicompare/">
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((registrations) => registrations.forEach((registration) => registration.unregister()));
location.replace('https://webapps.neurodesk.org/dicompare' + (location.pathname === '/' ? '/' : location.pathname) + location.search + location.hash);
</script>
</head>
<body>
<p>dicompare has moved to <a href="https://webapps.neurodesk.org/dicompare/">webapps.neurodesk.org/dicompare</a>.</p>
</body>
</html>
